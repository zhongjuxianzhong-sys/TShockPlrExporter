name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TShockPlrExporter.csproj

      - name: Build
        run: dotnet build TShockPlrExporter.csproj -c Release --no-restore --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TShockPlrExporter-Release
          path: bin/Release/net9.0/TShockPlrExporter.dll
          if-no-files-found: error
